%YAML 1.1
---
env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUSTC_WRAPPER: ''
  RUSTUP_MAX_RETRIES: '10'
  RUST_BACKTRACE: short
jobs:
  flake-app:
    name: nix run .#check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Lean cache setup
      run: "mkdir -p /tmp/nix-lean-cache\nchmod 0777 /tmp/nix-lean-cache\nprintf '#!/bin/sh\\
        nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\\nnix copy --to \"file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true\"\
        \ $OUT_PATHS || true\\n' > /tmp/nix-lean-pbh.sh\nchmod 0755 /tmp/nix-lean-pbh.sh\n"
      shell: bash
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: "lazy-trees = true\npost-build-hook = /tmp/nix-lean-pbh.sh\nextra-substituters
          = file:///tmp/nix-lean-cache\nextra-trusted-substituters = file:///tmp/nix-lean-cache\n\
          require-sigs = false\n"
    - name: Lean nix cache (built-only paths)
      uses: actions/cache@v5
      with:
        key: nix-lean-${{ runner.os }}-${{ github.run_id }}
        path: /tmp/nix-lean-cache
        restore-keys: nix-lean-${{ runner.os }}-
    - name: Run check
      run: nix run .#check
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
name: Errors
'on':
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
